    return base + (val ? (base.indexOf('?') >= 0 ? '&' : '?') + key + '=' + encodeURIComponent(val) : '');
  };
  const links = function () { return S.links || { form: appUrl + '?page=form', scanner: appUrl + '?page=scanner' }; };
  const formUrl = function (code) { return withParam(links().form, 'store', code); };
  const scanUrl = function (tag) { return withParam(links().scanner, 'tag', tag); };
  const isAdmin = function () { return S.user && S.user.role === 'admin'; };
  const storeOf = function (id) { return S.storeById[String(id)] || null; };
  const thumb = function (url, w) { return url ? String(url).replace(/sz=w\d+/, 'sz=w' + (w || 200)) : ''; };
  const norm = function (v) { return String(v == null ? '' : v).toLowerCase(); };

  /* ---------------- Boot & data ---------------- */

  function showLogin() {
    $('#app').hidden = true;
    AM.renderLogin($('#login-root'), {
      title: 'Asset Management', subtitle: 'Sign in to manage store assets.',
      onSuccess: function () { $('#login-root').innerHTML = ''; load(); }
    });
  }

  function load() {
    $('#app').hidden = false;
    $('#page').innerHTML = '<div class="loading-block"><span class="spinner lg"></span>Loading assets…</div>';
    return AM.call('getAppData', AM.getToken()).then(setData).then(renderAll).catch(handleError);
  }

  function refresh(msg) {
    return AM.call('getAppData', AM.getToken()).then(function (d) { setData(d); renderAll(); if (msg) AM.toast(msg); })
      .catch(handleError);
  }

  function setData(d) {
    S.user = d.user; S.stores = d.stores; S.assets = d.assets; S.regs = d.registrations;
    S.history = d.history; S.historyTotal = d.historyTotal; S.users = d.users; S.lists = d.lists;
    S.links = d.links;
    $('#lnk-scan').href = scanUrl(); $('#lnk-form').href = formUrl();
    S.storeById = {};
    S.stores.forEach(function (s) { S.storeById[String(s.id)] = s; });
    const ids = new Set(S.assets.map(function (a) { return String(a.id); }));
    S.selected.forEach(function (id) { if (!ids.has(id)) S.selected.delete(id); });
  }

  function handleError(e) {
    if (AM.isExpired(e)) { AM.clearToken(); AM.toast('Your session ended. Sign in again.', 'info'); showLogin(); return; }
    AM.toast(AM.errMsg(e), 'error');
    if (!S.user) $('#page').innerHTML = '<div class="empty"><h4>Could not load the data</h4><p>' + esc(AM.errMsg(e)) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>';
  }
  function safe(p) { return p.catch(function () {}); }

  /* ---------------- Shell ---------------- */

  function renderAll() {
    const u = S.user;
    $('#u-name').textContent = u.full_name || u.username;
    $('#u-role').textContent = ROLE_LABEL[u.role] || u.role;
    $('#u-avatar').textContent = String(u.full_name || u.username).split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    renderNav();
    renderPage();
  }

  function renderNav() {
    const pending = S.regs.filter(function (r) { return r.status === 'Pending'; }).length;
    const html = PAGES.filter(function (p) { return !p.admin || isAdmin(); }).map(function (p) {
      return '<a class="nav-link ' + (S.page === p.id ? 'active' : '') + '" data-page="' + p.id + '" tabindex="0">' + icon(p.icon) + esc(p.label) +
        (p.id === 'assets' && pending ? '<span class="count">' + pending + '</span>' : '') + '</a>';
    }).join('');
    $('#side-nav').innerHTML = html;
    $('#mobile-nav').innerHTML = html;
    $$('[data-page]').forEach(function (a) {
      a.onclick = function () { go(a.dataset.page); };
      a.onkeydown = function (e) { if (e.key === 'Enter') go(a.dataset.page); };
    });
  }

  function go(page) {
    S.page = page;
    renderNav(); renderPage();
    window.scrollTo(0, 0);
  }

  function header(title, sub, actions) {
    $('#page-title').textContent = title;
    $('#page-sub').innerHTML = sub || '';
    $('#page-actions').innerHTML = (actions || '') +
      '<button class="btn icon-btn" id="btn-refresh" title="Refresh">' + icon('refresh') + '</button>';
    $('#btn-refresh').onclick = function () { const b = this; AM.busy(b, true); refresh('Up to date').finally(function () { AM.busy(b, false); }); };
  }

  function renderPage() {
    ({ dashboard: renderDashboard, stores: renderStores, assets: renderAssets, history: renderHistory, users: renderUsers }[S.page] || renderDashboard)();
  }

  /* ---------------- Dashboard ---------------- */

  function renderDashboard() {
    const live = S.assets.filter(function (a) { return a.status !== 'Disposed'; });
    const byStatus = {};
    S.assets.forEach(function (a) { byStatus[a.status] = (byStatus[a.status] || 0) + 1; });
    const pending = S.regs.filter(function (r) { return r.status === 'Pending'; });
    const pendingQty = pending.reduce(function (t, r) { return t + r.items.reduce(function (n, it) { return n + (Number(it.quantity) || 1); }, 0); }, 0);

    header('Dashboard', 'Asset count across all stores, Commissary and Head Office.');

    const kpi = function (label, value, color, cls) {
      return '<div class="kpi ' + (cls || '') + '"' + (color ? ' style="color:' + color + '"' : '') + '><span>' + label + '</span><b style="color:var(--text)">' + value.toLocaleString() + '</b>' + (color ? '<div class="bar"></div>' : '') + '</div>';
    };

    const types = S.lists.storeTypes;
    const byType = types.map(function (t) {
      return { t: t, n: live.filter(function (a) { const s = storeOf(a.store_id); return s && s.type === t; }).length };
    });
    const maxType = Math.max(1, Math.max.apply(null, byType.map(function (x) { return x.n; })));

    const statusColors = { 'Active': 'var(--ok)', 'In Transit': 'var(--warn)', 'Under Repair': 'var(--bad)', 'In Storage': 'var(--info)', 'Disposed': 'var(--off)' };
    const maxStatus = Math.max(1, Math.max.apply(null, S.lists.statuses.map(function (s) { return byStatus[s] || 0; })));

    const perStore = {};
    live.forEach(function (a) { perStore[a.store_id] = (perStore[a.store_id] || 0) + 1; });
    const topStores = Object.keys(perStore).map(function (id) { return { s: storeOf(id), n: perStore[id] }; })
      .filter(function (x) { return x.s; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 6);

    const scans = S.history.filter(function (h) { return h.action === 'Checked In' || h.action === 'Checked Out'; }).slice(0, 8);
    const assetById = {};
    S.assets.forEach(function (a) { assetById[a.id] = a; });

    $('#page').innerHTML =
      '<div class="kpis">' +
        kpi('Total assets', live.length, '', 'hero') +
        kpi('Active', byStatus['Active'] || 0, 'var(--ok)') +
        kpi('In transit', byStatus['In Transit'] || 0, 'var(--warn)') +
        kpi('Under repair', byStatus['Under Repair'] || 0, 'var(--bad)') +
        kpi('Waiting for approval', pendingQty, 'var(--orange-2)') +
      '</div>' +
      '<div class="dash-grid">' +
        '<div style="display:grid;gap:16px;align-content:start">' +
          '<section class="panel"><div class="panel-head"><h3>Latest scans</h3><button class="btn btn-ghost btn-sm" data-go="history">See history</button></div><div class="panel-body"><div class="feed">' +
            (scans.length ? scans.map(function (h) {
              const a = assetById[h.asset_id] || {}, s = storeOf(h.store_id), isIn = h.action === 'Checked In';
              return '<div class="feed-row clickable" data-asset="' + esc(h.asset_id) + '" style="cursor:pointer">' +
                '<div class="dir ' + (isIn ? 'in' : 'out') + '">' + icon(isIn ? 'arrowIn' : 'arrowOut') + '</div>' +
                '<div style="min-width:0"><b>' + esc(a.name || 'Asset') + '</b> <span class="tag-code muted" style="font-size:12px">' + esc(a.tag_code || '') + '</span>' +
                '<div class="sub">' + (isIn ? 'Checked in at ' : 'Checked out from ') + esc(s ? s.name : '—') + (h.actor ? ' by ' + esc(h.actor) : '') + '</div></div>' +
                '<div class="when">' + AM.timeAgo(h.created_at) + (AM.hasCoords(h.lat, h.lng) ? '<br><a href="' + AM.mapUrl(h.lat, h.lng) + '" target="_blank" data-stop>Map</a>' : '') + '</div></div>';
            }).join('') : '<div class="empty" style="padding:26px 10px"><p style="margin:0">No scans yet. Check-ins and check-outs from the Asset Scanner show here.</p></div>') +
          '</div></div></section>' +
          '<section class="panel"><div class="panel-head"><h3>Waiting for approval</h3><button class="btn btn-ghost btn-sm" data-go="regs">Review all</button></div><div class="panel-body"><div class="feed">' +
            (pending.length ? pending.slice(0, 5).map(function (r) {
              const s = storeOf(r.store_id), qty = r.items.reduce(function (n, it) { return n + (Number(it.quantity) || 1); }, 0);
              return '<div class="feed-row" data-go="regs" style="cursor:pointer;grid-template-columns:1fr auto">' +
                '<div><b>' + esc(s ? s.name : 'Unknown store') + '</b><div class="sub">' + esc(r.ref_no) + ', ' + qty + (qty === 1 ? ' asset' : ' assets') + ' from ' + esc(r.submitted_by) + '</div></div>' +
                '<div class="when">' + AM.timeAgo(r.created_at) + '</div></div>';
            }).join('') : '<div class="empty" style="padding:26px 10px"><p style="margin:0">Nothing to review. New store registrations land here.</p></div>') +
          '</div></div></section>' +
        '</div>' +
        '<div style="display:grid;gap:16px;align-content:start">' +
          '<section class="panel"><div class="panel-head"><h3>Assets by location</h3></div><div class="panel-body"><div class="bars">' +
            byType.map(function (x) {
              return '<div class="bar-row"><span>' + esc(x.t) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + (x.n / maxType * 100) + '%"></div></div><b class="num" style="text-align:right">' + x.n + '</b></div>';
            }).join('') +
          '</div></div></section>' +
          '<section class="panel"><div class="panel-head"><h3>Assets by status</h3></div><div class="panel-body"><div class="bars">' +
            S.lists.statuses.map(function (st) {
              const n = byStatus[st] || 0;
              return '<div class="bar-row"><span>' + esc(st) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + (n / maxStatus * 100) + '%;background:' + statusColors[st] + '"></div></div><b class="num" style="text-align:right">' + n + '</b></div>';
            }).join('') +
          '</div></div></section>' +
          '<section class="panel"><div class="panel-head"><h3>Stores with the most assets</h3></div><div class="panel-body"><div class="feed">' +
            (topStores.length ? topStores.map(function (x) {
              return '<div class="feed-row" data-store="' + esc(x.s.id) + '" style="cursor:pointer;grid-template-columns:1fr auto"><div><b>' + esc(x.s.name) + '</b><div class="sub">' + esc(x.s.type) + (x.s.area ? ', ' + esc(x.s.area) : '') + '</div></div><b class="num">' + x.n + '</b></div>';
            }).join('') : '<p class="muted" style="margin:0">No assets yet.</p>') +
          '</div></div></section>' +
        '</div>' +
      '</div>';

    $$('[data-stop]').forEach(function (a) { a.addEventListener('click', function (e) { e.stopPropagation(); }); });
    $$('[data-asset]').forEach(function (el) { el.onclick = function () { openAsset(el.dataset.asset); }; });
    $$('[data-store]').forEach(function (el) { el.onclick = function () { openStore(el.dataset.store); }; });
    $$('[data-go]').forEach(function (el) {
      el.onclick = function () {
        if (el.dataset.go === 'regs') { S.f.assetTab = 'regs'; S.f.regStatus = 'Pending'; go('assets'); } else go(el.dataset.go);
      };
    });
  }

  /* ---------------- Store Directory ---------------- */

  function renderStores() {
    const f = S.f.stores;
    header('Store Directory', S.stores.length + ' locations',
      '<button class="btn" id="btn-copy-form">' + icon('link') + 'Copy form link</button>' +
      (isAdmin() ? '<button class="btn btn-primary" id="btn-add-store">' + icon('plus') + 'Add store</button>' : ''));

    $('#page').innerHTML =
      '<div class="toolbar">' +
        '<div class="search">' + icon('search') + '<input class="input" id="st-q" placeholder="Search name, code, area" value="' + esc(f.q) + '"></div>' +
        '<div class="segmented" id="st-type">' + ['All'].concat(S.lists.storeTypes).map(function (t) {
          return '<button data-v="' + esc(t) + '" class="' + (f.type === t ? 'on' : '') + '">' + esc(t) + '</button>';
        }).join('') + '</div>' +
        '<select class="select" id="st-status"><option value="Open">Open stores</option><option value="Closed">Closed stores</option><option value="">All stores</option></select>' +
      '</div><div id="st-list"></div>';

    $('#st-status').value = f.status;
    $('#st-q').oninput = function () { f.q = this.value; renderStoreList(); };
    $('#st-status').onchange = function () { f.status = this.value; renderStoreList(); };
    $$('#st-type button').forEach(function (b) {
      b.onclick = function () { f.type = b.dataset.v; $$('#st-type button').forEach(function (x) { x.classList.toggle('on', x === b); }); renderStoreList(); };
    });
    $('#btn-copy-form').onclick = function () { AM.copyText(formUrl()).then(function (ok) { AM.toast(ok ? 'Form link copied' : 'Copy failed. Open a store to copy its link.', ok ? '' : 'error'); }); };
    if ($('#btn-add-store')) $('#btn-add-store').onclick = function () { editStore(null); };
    renderStoreList();
  }

  function renderStoreList() {
    const f = S.f.stores, q = norm(f.q);
    const counts = {};
    S.assets.forEach(function (a) { if (a.status !== 'Disposed') counts[a.store_id] = (counts[a.store_id] || 0) + 1; });
    const list = S.stores.filter(function (s) {
      return (f.type === 'All' || s.type === f.type) && (!f.status || s.status === f.status) &&
        (!q || norm(s.name + ' ' + s.code + ' ' + s.area + ' ' + s.address + ' ' + s.contact_person).indexOf(q) >= 0);
    }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });

    if (!list.length) {
      $('#st-list').innerHTML = '<div class="table-wrap"><div class="empty">' + icon('store') +
        (S.stores.length ? '<h4>No stores match</h4><p>Try another search or filter.</p>'
          : '<h4>Add your first store</h4><p>Stores, the Commissary, Head Office and storage areas all live here. Each one gets its own registration form link.</p>' +
            (isAdmin() ? '<button class="btn btn-primary" id="st-empty-add">' + icon('plus') + 'Add store</button>' : '')) + '</div></div>';
      if ($('#st-empty-add')) $('#st-empty-add').onclick = function () { editStore(null); };
      return;
    }
    $('#st-list').innerHTML = '<div class="table-wrap"><table class="table"><thead><tr>' +
      '<th>Code</th><th>Store</th><th>Type</th><th>Area</th><th>Contact</th><th style="text-align:right">Assets</th><th>Status</th></tr></thead><tbody>' +
      list.map(function (s) {
        return '<tr class="clickable" data-id="' + esc(s.id) + '"><td class="tag-code">' + esc(s.code) + '</td>' +
          '<td><b>' + esc(s.name) + '</b>' + (s.address ? '<div class="sub">' + esc(s.address) + '</div>' : '') + '</td>' +
          '<td><span class="pill plain brand">' + esc(s.type) + '</span></td><td>' + esc(s.area || '—') + '</td>' +
          '<td>' + esc(s.contact_person || '—') + (s.contact_no ? '<div class="sub">' + esc(s.contact_no) + '</div>' : '') + '</td>' +
          '<td class="num" style="text-align:right;font-weight:700">' + (counts[s.id] || 0) + '</td><td>' + pill(s.status) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    $$('#st-list tr[data-id]').forEach(function (tr) { tr.onclick = function () { openStore(tr.dataset.id); }; });
  }

  function openStore(id) {
    const s = storeOf(id);
    if (!s) return;
    const assets = S.assets.filter(function (a) { return String(a.store_id) === String(s.id) && a.status !== 'Disposed'; });
    const link = formUrl(s.code);
    const m = AM.modal({
      title: s.name, wide: true, noFocus: true,
      subtitle: '<span class="tag-code">' + esc(s.code) + '</span>&nbsp; ' + pill(s.type) + ' ' + pill(s.status),
      body:
        '<dl class="facts" style="margin-top:0;grid-template-columns:repeat(3,1fr)">' +
          fact('Area', s.area) + fact('Contact person', s.contact_person) + fact('Contact no.', s.contact_no) +
          '<div style="grid-column:span 2"><dt>Address</dt><dd>' + esc(s.address || '—') + '</dd></div>' +
          '<div><dt>Map pin</dt><dd>' + (AM.hasCoords(s.lat, s.lng) ? '<a href="' + AM.mapUrl(s.lat, s.lng) + '" target="_blank">Open in Google Maps</a>' : '<span class="dim">Not set</span>') + '</dd></div>' +
        '</dl>' +
        '<div class="section-title">Registration form link for this store</div>' +
        '<div class="link-box"><input class="input" readonly value="' + esc(link) + '"><button class="btn" data-copy>' + icon('link') + 'Copy</button></div>' +
        '<p class="note-line">Send this to the store. The form opens with their store already picked.</p>' +
        '<div class="section-title">' + assets.length + (assets.length === 1 ? ' asset' : ' assets') + ' here</div>' +
        (assets.length ? '<div class="table-wrap" style="max-height:320px;overflow:auto"><table class="table"><tbody>' + assets.map(function (a) {
          return '<tr class="clickable" data-asset="' + esc(a.id) + '"><td style="width:52px">' + photoThumb(a.photo_url) + '</td><td class="tag-code">' + esc(a.tag_code) + '</td><td><b>' + esc(a.name) + '</b><div class="sub">' + esc(a.category || '') + '</div></td><td>' + pill(a.status) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="muted" style="margin:0">No assets registered at this location yet.</p>'),
      foot: (assets.length ? '<button class="btn" data-print>' + icon('print') + 'Print tags</button>' : '') +
        (isAdmin() ? '<button class="btn" data-addasset>' + icon('plus') + 'Add asset here</button><button class="btn btn-primary" data-edit>' + icon('edit') + 'Edit store</button>' : '')
    });
    m.el.querySelector('[data-copy]').onclick = function () { AM.copyText(link).then(function (ok) { AM.toast(ok ? 'Link copied' : 'Select the link and copy it manually.', ok ? '' : 'error'); }); };
    $$('[data-asset]', m.el).forEach(function (tr) { tr.onclick = function () { m.close(); openAsset(tr.dataset.asset); }; });
    if (m.el.querySelector('[data-print]')) m.el.querySelector('[data-print]').onclick = function () { printTags(assets); };
    if (m.el.querySelector('[data-edit]')) m.el.querySelector('[data-edit]').onclick = function () { m.close(); editStore(s); };
    if (m.el.querySelector('[data-addasset]')) m.el.querySelector('[data-addasset]').onclick = function () { m.close(); editAsset(null, s.id); };
  }

  function editStore(s) {
    const isNew = !s; s = s || { type: 'Cocopan', status: 'Open' };
    const m = AM.modal({
      title: isNew ? 'Add store' : 'Edit store',
      body:
        '<div class="grid-2">' +
          '<div class="field"><label class="req" for="sf-code">Store code</label><input class="input" id="sf-code" value="' + esc(s.code || '') + '" placeholder="e.g. CCP-QC01"></div>' +
          '<div class="field"><label class="req" for="sf-type">Type</label><select class="select" id="sf-type">' + S.lists.storeTypes.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field span-2"><label class="req" for="sf-name">Store name</label><input class="input" id="sf-name" value="' + esc(s.name || '') + '"></div>' +
          '<div class="field span-2"><label for="sf-address">Address</label><input class="input" id="sf-address" value="' + esc(s.address || '') + '"></div>' +
          '<div class="field"><label for="sf-area">Area / cluster</label><input class="input" id="sf-area" value="' + esc(s.area || '') + '"></div>' +
          '<div class="field"><label for="sf-status">Status</label><select class="select" id="sf-status"><option>Open</option><option>Closed</option></select></div>' +
          '<div class="field"><label for="sf-person">Contact person</label><input class="input" id="sf-person" value="' + esc(s.contact_person || '') + '"></div>' +
          '<div class="field"><label for="sf-phone">Contact no.</label><input class="input" id="sf-phone" value="' + esc(s.contact_no || '') + '"></div>' +
          '<div class="field"><label for="sf-lat">Latitude</label><input class="input" id="sf-lat" inputmode="decimal" value="' + esc(s.lat) + '"></div>' +
          '<div class="field"><label for="sf-lng">Longitude</label><input class="input" id="sf-lng" inputmode="decimal" value="' + esc(s.lng) + '"></div>' +
          '<div class="span-2"><button type="button" class="btn btn-sm" id="sf-here">' + icon('pin') + 'Use my current location</button>' +
          '<p class="note-line" style="margin-top:8px">The map pin lets the scanner suggest the nearest store when FM checks an asset in.</p></div>' +
        '</div>',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="sf-save">' + (isNew ? 'Add store' : 'Save changes') + '</button>'
    });
    $('#sf-type', m.el).value = s.type; $('#sf-status', m.el).value = s.status || 'Open';
    $('#sf-here', m.el).onclick = function () {
      const b = this;
      if (!navigator.geolocation) { AM.toast('This browser cannot share location.', 'error'); return; }
      AM.busy(b, true, 'Finding you');
      navigator.geolocation.getCurrentPosition(function (p) {
        $('#sf-lat', m.el).value = p.coords.latitude.toFixed(6); $('#sf-lng', m.el).value = p.coords.longitude.toFixed(6);
        AM.busy(b, false); AM.toast('Location filled in (±' + Math.round(p.coords.accuracy) + ' m)');
      }, function (err) { AM.busy(b, false); AM.toast('Location is blocked: ' + err.message, 'error'); }, { enableHighAccuracy: true, timeout: 15000 });
    };
    $('#sf-save', m.el).onclick = function () {
      const b = this;
      const data = { id: s.id, code: $('#sf-code', m.el).value, name: $('#sf-name', m.el).value, type: $('#sf-type', m.el).value,
        address: $('#sf-address', m.el).value, area: $('#sf-area', m.el).value, status: $('#sf-status', m.el).value,
        contact_person: $('#sf-person', m.el).value, contact_no: $('#sf-phone', m.el).value,
        lat: $('#sf-lat', m.el).value.trim(), lng: $('#sf-lng', m.el).value.trim() };
      AM.busy(b, true, 'Saving');
      AM.call('saveStore', AM.getToken(), data)
        .then(function () { m.close(); return refresh(isNew ? 'Store added' : 'Store saved'); })
        .catch(function (e) { AM.busy(b, false); handleErrorSoft(e); });
    };
  }

  function handleErrorSoft(e) {
    if (AM.isExpired(e)) { AM.clearToken(); $$('.modal-backdrop').forEach(function (x) { x.remove(); }); showLogin(); return; }
    AM.toast(AM.errMsg(e), 'error');
  }

  /* ---------------- Assets ---------------- */

  function renderAssets() {
    const pending = S.regs.filter(function (r) { return r.status === 'Pending'; }).length;
    const live = S.assets.filter(function (a) { return a.status !== 'Disposed'; }).length;
    header('Assets', live.toLocaleString() + ' assets in use',
      (isAdmin() ? '<button class="btn btn-primary" id="btn-add-asset">' + icon('plus') + 'Add asset</button>' : ''));
    if ($('#btn-add-asset')) $('#btn-add-asset').onclick = function () { editAsset(null); };

    $('#page').innerHTML =
      '<div class="toolbar"><div class="segmented" id="as-tabs">' +
        '<button data-v="all" class="' + (S.f.assetTab === 'all' ? 'on' : '') + '">All assets</button>' +
        '<button data-v="regs" class="' + (S.f.assetTab === 'regs' ? 'on' : '') + '">Registrations' + (pending ? '<span class="count">' + pending + '</span>' : '') + '</button>' +
      '</div></div><div id="as-body"></div>';
    $$('#as-tabs button').forEach(function (b) {
      b.onclick = function () { S.f.assetTab = b.dataset.v; renderAssets(); };
    });
    if (S.f.assetTab === 'regs') renderRegistrations(); else renderAssetTable();
  }

  function filteredAssets() {
    const f = S.f.assets, q = norm(f.q);
    return S.assets.filter(function (a) {
      const s = storeOf(a.store_id);
      if (f.status ? a.status !== f.status : a.status === 'Disposed') return false;
      if (f.type && (!s || s.type !== f.type)) return false;
      if (f.category && a.category !== f.category) return false;
      if (f.store && String(a.store_id) !== f.store) return false;
      if (q && norm([a.tag_code, a.name, a.category, a.brand_model, a.serial_no, s ? s.name : ''].join(' ')).indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });
  }

  function renderAssetTable() {
    const f = S.f.assets;
    const cats = Array.from(new Set(AM.CATEGORIES.concat(S.assets.map(function (a) { return a.category; }).filter(Boolean))));
    const stores = S.stores.slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    $('#as-body').innerHTML =
      '<div class="toolbar">' +
        '<div class="search">' + icon('search') + '<input class="input" id="af-q" placeholder="Search tag, name, serial, store" value="' + esc(f.q) + '"></div>' +
        '<select class="select" id="af-status"><option value="">In use (not disposed)</option>' + S.lists.statuses.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
        '<select class="select" id="af-type"><option value="">All location types</option>' + S.lists.storeTypes.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
        '<select class="select" id="af-store"><option value="">All stores</option>' + stores.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select>' +
        '<select class="select" id="af-cat"><option value="">All categories</option>' + cats.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
        '<span class="spacer"></span>' +
        '<button class="btn" id="af-print">' + icon('print') + '<span id="af-print-label">Print tags</span></button>' +
      '</div><div id="af-list"></div>';
    $('#af-status').value = f.status; $('#af-type').value = f.type; $('#af-cat').value = f.category; $('#af-store').value = f.store;
    $('#af-q').oninput = function () { f.q = this.value; S.assetLimit = 200; renderAssetRows(); };
    [['af-status', 'status'], ['af-type', 'type'], ['af-cat', 'category'], ['af-store', 'store']].forEach(function (p) {
      $('#' + p[0]).onchange = function () { f[p[1]] = this.value; S.assetLimit = 200; renderAssetRows(); };
    });
    $('#af-print').onclick = function () {
      const list = S.selected.size ? S.assets.filter(function (a) { return S.selected.has(String(a.id)); }) : filteredAssets();
      if (!list.length) { AM.toast('No assets to print.', 'info'); return; }
      printTags(list);
    };
    renderAssetRows();
  }

  function renderAssetRows() {
    const list = filteredAssets();
    $('#af-print-label').textContent = S.selected.size ? 'Print ' + S.selected.size + ' selected' : 'Print tags (' + list.length + ')';
    if (!list.length) {
      $('#af-list').innerHTML = '<div class="table-wrap"><div class="empty">' + icon('box') +
        (S.assets.length ? '<h4>No assets match</h4><p>Try another search or clear the filters.</p>'
          : '<h4>No assets yet</h4><p>Approve a store registration or add an asset here. Each one gets a tag code and a QR label.</p>') + '</div></div>';
      return;
    }
    const shown = list.slice(0, S.assetLimit);
    const allOn = shown.every(function (a) { return S.selected.has(String(a.id)); });
    $('#af-list').innerHTML = '<div class="table-wrap"><table class="table"><thead><tr>' +
      '<th style="width:36px"><input type="checkbox" class="check" id="af-all" ' + (allOn ? 'checked' : '') + ' aria-label="Select all shown"></th>' +
      '<th style="width:56px"></th><th>Tag code</th><th>Asset</th><th>Location</th><th>Status</th><th>Condition</th><th>Last scan</th></tr></thead><tbody>' +
      shown.map(function (a) {
        const s = storeOf(a.store_id);
        return '<tr class="clickable" data-id="' + esc(a.id) + '">' +
          '<td data-nocl><input type="checkbox" class="check" data-sel="' + esc(a.id) + '" ' + (S.selected.has(String(a.id)) ? 'checked' : '') + ' aria-label="Select ' + esc(a.tag_code) + '"></td>' +
          '<td>' + photoThumb(a.photo_url) + '</td><td class="tag-code">' + esc(a.tag_code) + '</td>' +
          '<td><b>' + esc(a.name) + '</b><div class="sub">' + esc([a.category, a.brand_model].filter(Boolean).join(', ') || '—') + '</div></td>' +
          '<td>' + esc(s ? s.name : '—') + '<div class="sub">' + esc(s ? s.type : '') + '</div></td>' +
          '<td>' + pill(a.status) + '</td><td>' + esc(a.condition || '—') + '</td>' +
          '<td class="muted" style="white-space:nowrap">' + (a.last_scan_at ? AM.timeAgo(a.last_scan_at) : '—') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      (list.length > shown.length ? '<div class="more-row"><button class="btn btn-sm" id="af-more">Show ' + Math.min(200, list.length - shown.length) + ' more of ' + (list.length - shown.length) + '</button></div>' : '') +
      '</div>';
    $$('#af-list tr[data-id]').forEach(function (tr) {
      tr.onclick = function (e) { if (e.target.closest('[data-nocl]')) return; openAsset(tr.dataset.id); };
    });
    $$('#af-list [data-sel]').forEach(function (c) {
      c.onchange = function () { if (c.checked) S.selected.add(c.dataset.sel); else S.selected.delete(c.dataset.sel); renderAssetRows(); };
    });
    $('#af-all').onchange = function () {
      const on = this.checked;
      shown.forEach(function (a) { if (on) S.selected.add(String(a.id)); else S.selected.delete(String(a.id)); });
      renderAssetRows();
    };
    if ($('#af-more')) $('#af-more').onclick = function () { S.assetLimit += 200; renderAssetRows(); };
  }

  function photoThumb(url) {
    return url ? '<img class="thumb" loading="lazy" src="' + esc(thumb(url, 120)) + '" alt="">'
      : '<div class="thumb thumb-empty">' + icon('image') + '</div>';
  }
  function fact(label, value, raw) {
    return '<div><dt>' + esc(label) + '</dt><dd>' + (raw ? value : esc(value === '' || value == null ? '—' : value)) + '</dd></div>';
  }

  function openAsset(id) {
    const a = S.assets.find(function (x) { return String(x.id) === String(id); });
    if (!a) { AM.toast('That asset is no longer in the list. Refresh to update.', 'info'); return; }
    const s = storeOf(a.store_id);
    const reg = a.registration_id ? S.regs.find(function (r) { return String(r.id) === String(a.registration_id); }) : null;
    const m = AM.modal({
      title: a.name, wide: true, noFocus: true,
      subtitle: '<span class="tag-code">' + esc(a.tag_code) + '</span>&nbsp; ' + pill(a.status),
      body:
        '<div class="detail"><div>' +
          (a.photo_url ? '<a href="' + esc(thumb(a.photo_url, 1600)) + '" target="_blank"><img class="photo-lg" src="' + esc(thumb(a.photo_url, 800)) + '" alt="Photo of ' + esc(a.name) + '"></a>'
            : '<div class="photo-lg empty-photo">' + icon('image') + '</div>') +
          '<div style="margin-top:16px">' + AM.tagLabel(a, s, scanUrl(a.tag_code)) + '</div>' +
        '</div><div>' +
          '<dl class="facts" style="margin-top:0">' +
            fact('Location', s ? s.name + ' (' + s.type + ')' : '—') + fact('Category', a.category) +
            fact('Brand / model', a.brand_model) + fact('Serial no.', a.serial_no) +
            fact('Condition', a.condition) + fact('Acquired', a.acquired_date ? AM.fmtDate(a.acquired_date) : '') +
            fact('Cost', AM.peso(a.cost)) + fact('Registered through', reg ? reg.ref_no : 'Web app') +
            fact('Last scan', a.last_scan_at ? AM.fmtDate(a.last_scan_at, true) + (AM.hasCoords(a.last_lat, a.last_lng) ? ' · <a href="' + AM.mapUrl(a.last_lat, a.last_lng) + '" target="_blank">Map</a>' : '') : '—', !!a.last_scan_at) +
            fact('Added', AM.fmtDate(a.created_at)) +
            (a.notes ? '<div style="grid-column:1/-1"><dt>Notes</dt><dd>' + esc(a.notes) + '</dd></div>' : '') +
          '</dl>' +
          '<div class="section-title">History</div><div id="ad-history"><div class="loading-block" style="padding:20px 0"><span class="spinner"></span></div></div>' +
        '</div></div>',
      foot: '<a class="btn" href="' + esc(scanUrl(a.tag_code)) + '" target="_blank">' + icon('scan') + 'Open in scanner</a>' +
        '<button class="btn" data-print>' + icon('print') + 'Print tag</button>' +
        (isAdmin() ? '<button class="btn btn-primary" data-edit>' + icon('edit') + 'Edit asset</button>' : '')
    });
    m.el.querySelector('[data-print]').onclick = function () { printTags([a]); };
    if (m.el.querySelector('[data-edit]')) m.el.querySelector('[data-edit]').onclick = function () { m.close(); editAsset(a); };
    AM.call('getAssetHistory', AM.getToken(), a.id).then(function (rows) {
      const box = m.el.querySelector('#ad-history'); if (!box) return;
      box.innerHTML = rows.length ? '<div class="timeline">' + rows.map(function (h) {
        const hs = storeOf(h.store_id);
        return '<div class="tl-row"><div class="tl-dot" style="background:' + ({ 'Checked In': 'var(--ok)', 'Checked Out': 'var(--warn)', 'Updated': 'var(--info)' }[h.action] || 'var(--orange)') + '"></div><div>' +
          '<b>' + esc(h.action) + '</b>' + (hs ? ' <span class="muted">at ' + esc(hs.name) + '</span>' : '') +
          (h.details ? '<div style="font-size:13px">' + esc(h.details) + '</div>' : '') +
          '<div class="sub">' + AM.fmtDate(h.created_at, true) + (h.actor ? ', ' + esc(h.actor) : '') +
          (AM.hasCoords(h.lat, h.lng) ? ' · <a href="' + AM.mapUrl(h.lat, h.lng) + '" target="_blank">Map</a>' : '') + '</div></div></div>';
      }).join('') + '</div>' : '<p class="muted" style="margin:0">No history yet.</p>';
    }).catch(function (e) { const box = m.el.querySelector('#ad-history'); if (box) box.innerHTML = '<p class="muted">' + esc(AM.errMsg(e)) + '</p>'; });
  }

  function editAsset(a, presetStore) {
    const isNew = !a; a = a || { status: 'Active', condition: 'Good', store_id: presetStore || '' };
    let newPhoto = null;
    const stores = S.stores.slice().sort(function (x, y) { return String(x.name).localeCompare(String(y.name)); });
    const cats = Array.from(new Set(AM.CATEGORIES.concat(a.category ? [a.category] : [])));
    const m = AM.modal({
      title: isNew ? 'Add asset' : 'Edit ' + a.tag_code,
      subtitle: isNew ? 'A tag code is created when you save.' : '',
      body:
        '<div class="photo-pick" style="margin-bottom:16px">' +
          (a.photo_url ? '<img id="ef-prev" src="' + esc(thumb(a.photo_url, 300)) + '" alt="">' : '<div class="ph" id="ef-prev">' + icon('camera') + '</div>') +
          '<div><label class="btn btn-sm" for="ef-photo">' + icon('image') + (a.photo_url ? 'Change photo' : 'Add photo') + '</label>' +
          '<input type="file" id="ef-photo" accept="image/*" hidden><p class="note-line" style="margin-top:8px">A clear photo of the item and its sticker or nameplate.</p></div>' +
        '</div>' +
        '<div class="grid-2">' +
          '<div class="field span-2"><label class="req" for="ef-name">Asset name</label><input class="input" id="ef-name" value="' + esc(a.name || '') + '" placeholder="e.g. Upright chiller, 2-door"></div>' +
          '<div class="field"><label for="ef-cat">Category</label><select class="select" id="ef-cat"><option value="">Choose</option>' + cats.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label for="ef-brand">Brand / model</label><input class="input" id="ef-brand" value="' + esc(a.brand_model || '') + '"></div>' +
          '<div class="field"><label for="ef-serial">Serial no.</label><input class="input" id="ef-serial" value="' + esc(a.serial_no || '') + '"></div>' +
          '<div class="field"><label class="req" for="ef-store">Location</label><select class="select" id="ef-store"><option value="">Choose</option>' +
            S.lists.storeTypes.map(function (t) {
              const g = stores.filter(function (s) { return s.type === t; });
              return g.length ? '<optgroup label="' + esc(t) + '">' + g.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + (s.status === 'Closed' ? ' (closed)' : '') + '</option>'; }).join('') + '</optgroup>' : '';
            }).join('') + '</select></div>' +
          '<div class="field"><label for="ef-status">Status</label><select class="select" id="ef-status">' + S.lists.statuses.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label for="ef-cond">Condition</label><select class="select" id="ef-cond">' + S.lists.conditions.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label for="ef-date">Date acquired</label><input class="input" type="date" id="ef-date" value="' + esc(a.acquired_date ? String(a.acquired_date).slice(0, 10) : '') + '"></div>' +
          '<div class="field"><label for="ef-cost">Cost (₱)</label><input class="input" id="ef-cost" inputmode="decimal" value="' + esc(a.cost) + '"></div>' +
          '<div class="field span-2"><label for="ef-notes">Notes</label><textarea class="textarea" id="ef-notes">' + esc(a.notes || '') + '</textarea></div>' +
        '</div>',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="ef-save">' + (isNew ? 'Add asset' : 'Save changes') + '</button>'
    });
    $('#ef-cat', m.el).value = a.category || ''; $('#ef-store', m.el).value = String(a.store_id || '');
    $('#ef-status', m.el).value = a.status; $('#ef-cond', m.el).value = a.condition || 'Good';
    $('#ef-photo', m.el).onchange = function () {
      const file = this.files[0]; if (!file) return;
      AM.compressImage(file).then(function (data) {
        newPhoto = data;
        const prev = $('#ef-prev', m.el);
        const img = document.createElement('img'); img.id = 'ef-prev'; img.src = data; img.alt = '';
        prev.replaceWith(img);
      }).catch(function (e) { AM.toast(AM.errMsg(e), 'error'); });
    };
    $('#ef-save', m.el).onclick = function () {
      const b = this;
      const data = { id: a.id, name: $('#ef-name', m.el).value, category: $('#ef-cat', m.el).value, brand_model: $('#ef-brand', m.el).value,
        serial_no: $('#ef-serial', m.el).value, store_id: $('#ef-store', m.el).value, status: $('#ef-status', m.el).value,
        condition: $('#ef-cond', m.el).value, acquired_date: $('#ef-date', m.el).value, cost: $('#ef-cost', m.el).value.replace(/[₱,\s]/g, ''),
        notes: $('#ef-notes', m.el).value, photo_url: a.photo_url || '' };
      if (!data.name.trim()) { AM.toast('Enter the asset name.', 'error'); return; }
      if (!data.store_id) { AM.toast('Pick the location of this asset.', 'error'); return; }
      AM.busy(b, true, newPhoto ? 'Uploading photo' : 'Saving');
      const up = newPhoto ? AM.call('uploadPhoto', newPhoto, AM.getToken()) : Promise.resolve(data.photo_url);
      up.then(function (url) { data.photo_url = url; return AM.call('saveAsset', AM.getToken(), data); })
        .then(function (saved) {
          m.close();
          return refresh(isNew ? 'Asset added as ' + saved.tag_code : 'Asset saved').then(function () { openAsset(saved.id); });
        })
        .catch(function (e) { AM.busy(b, false); handleErrorSoft(e); });
    };
  }

  /* ---------------- Registrations ---------------- */

  function renderRegistrations() {
    const st = S.f.regStatus;
    const counts = { Pending: 0, Approved: 0, Rejected: 0 };
    S.regs.forEach(function (r) { counts[r.status] = (counts[r.status] || 0) + 1; });
    $('#as-body').innerHTML =
      '<div class="toolbar"><div class="segmented" id="rg-st">' + ['Pending', 'Approved', 'Rejected', 'All'].map(function (x) {
        return '<button data-v="' + x + '" class="' + (st === x ? 'on' : '') + '">' + x + (x !== 'All' ? ' <span class="dim num">' + (counts[x] || 0) + '</span>' : '') + '</button>';
      }).join('') + '</div><span class="spacer"></span>' +
      '<button class="btn" id="rg-copy">' + icon('link') + 'Copy form link</button></div><div id="rg-list" class="reg-list"></div>';
    $$('#rg-st button').forEach(function (b) { b.onclick = function () { S.f.regStatus = b.dataset.v; renderRegistrations(); }; });
    $('#rg-copy').onclick = function () { AM.copyText(formUrl()).then(function (ok) { AM.toast(ok ? 'Form link copied' : 'Copy failed', ok ? '' : 'error'); }); };

    const list = S.regs.filter(function (r) { return st === 'All' || r.status === st; });
    if (!list.length) {
      $('#rg-list').innerHTML = '<div class="table-wrap"><div class="empty">' + icon('form') +
        '<h4>' + (st === 'Pending' ? 'Nothing waiting for approval' : 'No ' + st.toLowerCase() + ' registrations') + '</h4>' +
        '<p>Stores send registrations through the Asset Registration Form. Copy the form link and share it with your stores.</p></div></div>';
      return;
    }
    $('#rg-list').innerHTML = list.map(function (r) {
      const s = storeOf(r.store_id);
      const qty = r.items.reduce(function (n, it) { return n + (Number(it.quantity) || 1); }, 0);
      return '<article class="reg-card"><div class="reg-head"><div>' +
          '<h3>' + esc(s ? s.name : 'Unknown store') + ' ' + pill(r.status) + '</h3>' +
          '<p><span class="tag-code">' + esc(r.ref_no) + '</span>, sent by ' + esc(r.submitted_by) + (r.contact_no ? ' (' + esc(r.contact_no) + ')' : '') + ' on ' + AM.fmtDate(r.created_at, true) + '</p>' +
          (r.status !== 'Pending' ? '<p>' + esc(r.status) + ' by ' + esc(r.reviewed_by || '—') + ' on ' + AM.fmtDate(r.reviewed_at, true) + (r.remarks ? '. Reason: ' + esc(r.remarks) : '') + '</p>' : '') +
        '</div><div class="qty">' + qty + ' <span class="muted" style="font-size:13px;font-weight:500">' + (qty === 1 ? 'asset' : 'assets') + '</span></div></div>' +
        '<div class="reg-items">' + r.items.map(function (it) {
          return '<div class="reg-item">' +
            (it.photo_url ? '<a href="' + esc(thumb(it.photo_url, 1600)) + '" target="_blank"><img loading="lazy" src="' + esc(thumb(it.photo_url, 160)) + '" alt="Photo of ' + esc(it.name) + '"></a>' : '<div class="thumb thumb-empty">' + icon('image') + '</div>') +
            '<div style="min-width:0"><b>' + esc(it.name) + '</b><div class="sub">' + esc([it.category, it.brand_model, it.serial_no ? 'S/N ' + it.serial_no : '', it.condition].filter(Boolean).join(', ')) + '</div>' +
            (it.notes ? '<div style="font-size:12.5px;margin-top:2px">' + esc(it.notes) + '</div>' : '') + '</div>' +
            '<div class="qty">×' + esc(it.quantity) + '</div></div>';
        }).join('') + '</div>' +
        ((r.status === 'Pending' && isAdmin()) ? '<div class="reg-foot"><button class="btn btn-danger" data-reject="' + esc(r.id) + '">Reject</button><button class="btn btn-primary" data-approve="' + esc(r.id) + '" data-qty="' + qty + '">' + icon('check') + 'Approve and create ' + qty + (qty === 1 ? ' asset' : ' assets') + '</button></div>' : '') +
        (r.status === 'Approved' ? '<div class="reg-foot"><button class="btn" data-printreg="' + esc(r.id) + '">' + icon('print') + 'Print tags</button></div>' : '') +
      '</article>';
    }).join('');

    $$('[data-approve]').forEach(function (b) {
      b.onclick = function () {
        const id = b.dataset.approve, qty = b.dataset.qty;
        AM.confirmBox('Approve registration?', 'This creates ' + qty + ' tagged ' + (qty === '1' ? 'asset' : 'assets') + ' at this store. You can print the QR tags right after.', 'Approve').then(function (ok) {
          if (!ok) return;
          AM.busy(b, true, 'Creating assets');
          AM.call('approveRegistration', AM.getToken(), id).then(function (n) {
            return refresh(n + (n === 1 ? ' asset' : ' assets') + ' created').then(function () {
              const made = S.assets.filter(function (a) { return String(a.registration_id) === String(id); });
              AM.confirmBox('Print the tags now?', made.length + ' QR tags are ready for this store.', 'Print tags').then(function (yes) { if (yes) printTags(made); });
            });
          }).catch(function (e) { AM.busy(b, false); handleErrorSoft(e); });
        });
      };
    });
    $$('[data-reject]').forEach(function (b) {
      b.onclick = function () {
        const id = b.dataset.reject;
        const m = AM.modal({ title: 'Reject registration',
          body: '<div class="field"><label for="rj-why">Reason (the store sees this when you follow up)</label><textarea class="textarea" id="rj-why" placeholder="e.g. Photos are unclear, please resend"></textarea></div>',
          foot: '<button class="btn" data-close>Cancel</button><button class="btn btn-danger" id="rj-ok">Reject</button>' });
        $('#rj-ok', m.el).onclick = function () {
          const bb = this; AM.busy(bb, true);
          AM.call('rejectRegistration', AM.getToken(), id, $('#rj-why', m.el).value)
            .then(function () { m.close(); return refresh('Registration rejected'); })
            .catch(function (e) { AM.busy(bb, false); handleErrorSoft(e); });
        };
      };
    });
    $$('[data-printreg]').forEach(function (b) {
      b.onclick = function () {
        const made = S.assets.filter(function (a) { return String(a.registration_id) === String(b.dataset.printreg); });
        if (made.length) printTags(made); else AM.toast('These assets were removed or moved.', 'info');
      };
    });
  }

  /* ---------------- History ---------------- */

  function renderHistory() {
    const f = S.f.history;
    header('History', 'Every registration, edit, check-in and check-out.');
    $('#page').innerHTML =
      '<div class="toolbar">' +
        '<div class="search">' + icon('search') + '<input class="input" id="hf-q" placeholder="Search tag, asset, person" value="' + esc(f.q) + '"></div>' +
        '<select class="select" id="hf-action"><option value="">All activity</option><option>Checked In</option><option>Checked Out</option><option>Registered</option><option>Updated</option></select>' +
        '<select class="select" id="hf-type"><option value="">All location types</option>' + S.lists.storeTypes.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
        '<input class="input" type="date" id="hf-from" style="width:auto" value="' + esc(f.from) + '" aria-label="From date">' +
        '<input class="input" type="date" id="hf-to" style="width:auto" value="' + esc(f.to) + '" aria-label="To date">' +
      '</div><div id="hf-list"></div>' +
      (S.historyTotal > S.history.length ? '<p class="note-line">Showing the latest ' + S.history.length.toLocaleString() + ' of ' + S.historyTotal.toLocaleString() + ' records. The full log is in the History sheet, and each asset shows its complete history.</p>' : '');
    $('#hf-action').value = f.action; $('#hf-type').value = f.type;
    $('#hf-q').oninput = function () { f.q = this.value; S.historyLimit = 300; renderHistoryRows(); };
    [['hf-action', 'action'], ['hf-type', 'type'], ['hf-from', 'from'], ['hf-to', 'to']].forEach(function (p) {
      $('#' + p[0]).onchange = function () { f[p[1]] = this.value; S.historyLimit = 300; renderHistoryRows(); };
    });
    renderHistoryRows();
  }

  function renderHistoryRows() {
    const f = S.f.history, q = norm(f.q);
    const assetById = {};
    S.assets.forEach(function (a) { assetById[a.id] = a; });
    const from = f.from ? new Date(f.from + 'T00:00:00+08:00') : null;
    const to = f.to ? new Date(f.to + 'T23:59:59+08:00') : null;
    const list = S.history.filter(function (h) {
      const a = assetById[h.asset_id] || {}, s = storeOf(h.store_id), d = new Date(h.created_at);
      if (f.action && h.action !== f.action) return false;
      if (f.type && (!s || s.type !== f.type)) return false;
      if (from && d < from) return false;
      if (to && d > to) return false;
      if (q && norm([a.tag_code, a.name, h.actor, h.details, s ? s.name : ''].join(' ')).indexOf(q) < 0) return false;
      return true;
    });
    if (!list.length) {
      $('#hf-list').innerHTML = '<div class="table-wrap"><div class="empty">' + icon('clock') + '<h4>No activity found</h4><p>' +
        (S.history.length ? 'Try a wider date range or clear the filters.' : 'Activity appears here once assets are registered and scanned.') + '</p></div></div>';
      return;
    }
    const shown = list.slice(0, S.historyLimit);
    $('#hf-list').innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>When</th><th>Activity</th><th>Asset</th><th>Location</th><th>Details</th><th>By</th><th>GPS</th></tr></thead><tbody>' +
      shown.map(function (h) {
        const a = assetById[h.asset_id], s = storeOf(h.store_id);
        return '<tr class="clickable" data-asset="' + esc(h.asset_id) + '"><td style="white-space:nowrap">' + AM.fmtDate(h.created_at, true) + '</td><td>' + pill(h.action) + '</td>' +
          '<td>' + (a ? '<span class="tag-code">' + esc(a.tag_code) + '</span><div class="sub">' + esc(a.name) + '</div>' : '<span class="dim">Removed asset</span>') + '</td>' +
          '<td>' + esc(s ? s.name : '—') + '</td><td style="max-width:280px">' + esc(h.details || '—') + '</td><td>' + esc(h.actor || '—') + '</td>' +
          '<td data-nocl>' + (AM.hasCoords(h.lat, h.lng) ? '<a href="' + AM.mapUrl(h.lat, h.lng) + '" target="_blank">' + Number(h.lat).toFixed(4) + ', ' + Number(h.lng).toFixed(4) + '</a>' : '<span class="dim">—</span>') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      (list.length > shown.length ? '<div class="more-row"><button class="btn btn-sm" id="hf-more">Show more (' + (list.length - shown.length) + ' left)</button></div>' : '') + '</div>';
    $$('#hf-list tr[data-asset]').forEach(function (tr) {
      tr.onclick = function (e) { if (e.target.closest('[data-nocl]')) return; openAsset(tr.dataset.asset); };
    });
    if ($('#hf-more')) $('#hf-more').onclick = function () { S.historyLimit += 300; renderHistoryRows(); };
  }

  /* ---------------- Users ---------------- */

  function renderUsers() {
    if (!isAdmin()) { go('dashboard'); return; }
    header('Users', 'Who can sign in to the web app and the scanner.',
      '<button class="btn btn-primary" id="btn-add-user">' + icon('plus') + 'Add user</button>');
    $('#btn-add-user').onclick = function () { editUser(null); };
    $('#page').innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody>' +
      S.users.map(function (u) {
        return '<tr><td><b>' + esc(u.full_name) + '</b></td><td>' + esc(u.username) + '</td><td>' + esc(ROLE_LABEL[u.role] || u.role) + '</td>' +
          '<td>' + (u.active ? '<span class="pill ok">Active</span>' : '<span class="pill off">Disabled</span>') + '</td>' +
          '<td style="text-align:right"><button class="btn btn-sm" data-user="' + esc(u.id) + '">' + icon('edit') + 'Edit</button></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="note-line">Admin: full access. Facility &amp; Management: uses the Asset Scanner and can view the web app. Viewer: can only view.</p>';
    $$('[data-user]').forEach(function (b) {
      b.onclick = function () { editUser(S.users.find(function (u) { return String(u.id) === b.dataset.user; })); };
    });
  }

  function editUser(u) {
    const isNew = !u; u = u || { role: 'fm', active: true };
    const m = AM.modal({
      title: isNew ? 'Add user' : 'Edit ' + u.full_name,
      body: '<div class="grid-2">' +
        '<div class="field span-2"><label class="req" for="uf-name">Full name</label><input class="input" id="uf-name" value="' + esc(u.full_name || '') + '"></div>' +
        '<div class="field"><label class="req" for="uf-user">Username</label><input class="input" id="uf-user" autocapitalize="none" value="' + esc(u.username || '') + '" ' + (isNew ? '' : 'disabled') + '></div>' +
        '<div class="field"><label class="req" for="uf-role">Role</label><select class="select" id="uf-role"><option value="admin">Admin</option><option value="fm">Facility &amp; Management</option><option value="viewer">Viewer</option></select></div>' +
        '<div class="field"><label ' + (isNew ? 'class="req"' : '') + ' for="uf-pass">' + (isNew ? 'Password' : 'New password') + '</label><input class="input" id="uf-pass" type="text" autocomplete="new-password" placeholder="' + (isNew ? 'At least 6 characters' : 'Leave blank to keep') + '"></div>' +
        '<div class="field"><label for="uf-active">Access</label><select class="select" id="uf-active"><option value="1">Active</option><option value="0">Disabled</option></select></div>' +
        '</div>',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="uf-save">' + (isNew ? 'Add user' : 'Save changes') + '</button>'
    });
    $('#uf-role', m.el).value = u.role; $('#uf-active', m.el).value = u.active ? '1' : '0';
    $('#uf-save', m.el).onclick = function () {
      const b = this; AM.busy(b, true, 'Saving');
      AM.call('saveUser', AM.getToken(), { id: u.id, full_name: $('#uf-name', m.el).value, username: $('#uf-user', m.el).value,
        role: $('#uf-role', m.el).value, password: $('#uf-pass', m.el).value, active: $('#uf-active', m.el).value === '1' })
        .then(function (users) { S.users = users; m.close(); renderUsers(); AM.toast(isNew ? 'User added' : 'User saved'); })
        .catch(function (e) { AM.busy(b, false); handleErrorSoft(e); });
    };
  }

  function changePassword() {
    const m = AM.modal({
      title: 'Change password',
      body: '<div style="display:grid;gap:14px"><div class="field"><label for="cp-old">Current password</label><input class="input" type="password" id="cp-old" autocomplete="current-password"></div>' +
        '<div class="field"><label for="cp-new">New password</label><input class="input" type="password" id="cp-new" autocomplete="new-password"><span class="hint">At least 6 characters.</span></div></div>',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="cp-save">Change password</button>'
    });
    $('#cp-save', m.el).onclick = function () {
      const b = this; AM.busy(b, true);
      AM.call('changePassword', AM.getToken(), $('#cp-old', m.el).value, $('#cp-new', m.el).value)
        .then(function () { m.close(); AM.toast('Password changed'); })
        .catch(function (e) { AM.busy(b, false); handleErrorSoft(e); });
    };
  }

  /* ---------------- Printing ---------------- */

  function printTags(list) {
    const area = $('#print-area');
    area.innerHTML = list.map(function (a) { return AM.tagLabel(a, storeOf(a.store_id), scanUrl(a.tag_code)); }).join('');
    setTimeout(function () { window.print(); }, 150);
  }

  /* ---------------- Start ---------------- */

  $('#lnk-form').href = formUrl(); $('#lnk-form').innerHTML = icon('form') + 'Registration form';
  $('#lnk-scan').href = scanUrl(); $('#lnk-scan').innerHTML = icon('scan') + 'Asset scanner';
  $('#btn-pw').innerHTML = icon('key'); $('#btn-pw').onclick = changePassword;
  $('#btn-logout').innerHTML = icon('logout');
  $('#btn-logout').onclick = function () {
    AM.call('logout', AM.getToken()).catch(function () {});
    AM.clearToken(); S.page = 'dashboard'; showLogin();
  };

  if (AM.getToken()) safe(load()); else showLogin();
})();
</script>

</body>
</html>
